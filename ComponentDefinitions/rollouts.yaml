        	securityContext?: {...}

        	// +usage=Specify the tolerations to add to the pod spec
        	tolerations?: [...{
        		key:                string
        		operator?:          *"Equal" | "Exists"
        		value?:             string
        		effect?:            "NoSchedule" | "PreferNoSchedule" | "NoExecute"
        		tolerationSeconds?: int | 300
        	}]

        	// +usage=Define arguments by using environment variables
        	env?: [...{
        		// +usage=Environment variable name
        		name: string
        		// +usage=The value of the environment variable
        		value?: string
        		// +usage=Specifies a source the value of this var should come from
        		valueFrom?: {
        			// +usage=Selects a key of a secret in the pod's namespace
        			secretKeyRef?: {
        				// +usage=The name of the secret in the pod's namespace to select from
        				name: string
        				// +usage=The key of the secret to select from. Must be a valid secret key
        				key: string
        			}
        			// +usage=Selects a key of a config map in the pod's namespace
        			configMapKeyRef?: {
        				// +usage=The name of the config map in the pod's namespace to select from
        				name: string
        				// +usage=The key of the config map to select from. Must be a valid secret key
        				key: string
        			}
        		}
        	}]

        	// +usage=Number of CPU units the service is limited to, e.g. `0.5` (0.5 CPU core), `100m` (100 milli CPU core)
        	cpuLimit?: string

        	// +usage=The memory limit required for the sidecar container, e.g. `512Mi`
        	memoryLimit?: string

        	// +usage=Number of CPU units to request for the sidecar, e.g. `0.5` (0.5 CPU core), `100m` (100 milli CPU core)
        	cpuRequest?: string

        	// +usage=The memory resource to request for the sidecar container, e.g. `512Mi`
        	memoryRequest?: string

        	// +usage=Speecify pvc, configmap, secret volumes
        	volumeMounts?: {
        		// +usage=Mount PVC type volume
        		pvc?: [...{
        			name:      string
        			mountPath: string
        			// +usage=The name of the PVC
        			claimName: string
        		}]
        		// +usage=Mount ConfigMap type volume
        		configMap?: [...{
        			name:        string
        			mountPath:   string
        			defaultMode: *420 | int
        			cmName:      string
        			items?: [...{
        				key:  string
        				path: string
        				mode: *511 | int
        			}]
        		}]
        		// +usage=Mount Secret type volume
        		secret?: [...{
        			name:        string
        			mountPath:   string
        			defaultMode: *420 | int
        			secretName:  string
        			items?: [...{
        				key:  string
        				path: string
        				mode: *511 | int
        			}]
        		}]
        		// +usage=Mount EmptyDir type volume
        		emptyDir?: [...{
        			name:      string
        			mountPath: string
        			medium:    *"" | "Memory"
        		}]
        		// +usage=Mount HostPath type volume
        		hostPath?: [...{
        			name:      string
        			mountPath: string
        			path:      string
        		}]
        	}

        	// +usage=Instructions for assessing whether the container is alive.
        	livenessProbe?: #HealthProbe

        	// +usage=Instructions for assessing whether the container is in a suitable state to serve traffic.
        	readinessProbe?: #HealthProbe

        	// +usage=indicates whether the application within the container is started. All other probes are disabled if a startup probe is provided, until it succeeds.
        	startupProbe?: #HealthProbe

        	// +usage=Specify the hostAliases to add
        	hostAliases?: [...{
        		ip: string
        		hostnames: [...string]
        	}]
        	// End of Deployment Template parameters

        	// *Rollout* top level parameters. Experiment analysis parameters are not defined or supported yet. Follow the Rollout Spec order for parameters as in https://argo-rollouts.readthedocs.io/en/latest/features/specification/

        	// +usage=The Number of desired pods(Defaults to 3)
        	replicas: *3 | int
        	// +usage=Label selector for pods matching Stable ReplicaSets
        	labels?: [string]: string
        	// +usage=Minimum seconds a pod should be ready before considered available(defaults to 30 seconds)
        	minReadySeconds?: *30 | int
        	// +usage=If set to true, the rollout will not be started until it is manually resumed from (defaults to false)
        	paused: *false | bool
        	// +usage=The maximum time in seconds in which a rollout must make progress during an update, before it is considered to be failed(defaults to 600 seconds)
        	progressDeadlineSeconds?: *600 | int
        	// +usage=Limit on the number of ReplicaSets that can be stored for rollback(defaults to 3)
        	revisionHistoryLimit?: *3 | int
        	// +usage=The number of revisions to keep for rollback
        	rollbackRevision: *3 | int
        	limitAnalysisRuns?: {
        		// +usage=Success rate required to consider the analysis successful
        		successfulRunHistoryLimit?: int
        		// +usage=Number of failed runs before considering the analysis as failed
        		unsuccessfulRunHistoryLimit?: int
        	}
        	// Add strategy parameter definition
        	strategy?: {
        		// +usage=Type of deployment strategy, either Canary or BlueGreen
        		type: "Canary" | "BlueGreen"

        		// Canary specific fields
        		canary?: {
        			// +usage=The delay in seconds before scaling down the previous ReplicaSet when the rollout is aborted
        			abortScaleDownDelaySeconds: *30 | int
        			// Background analysis to run during a rollout update
        			analysis?: {
        				// +usage=Reference to the analysis template to use
        				templates?: [...{
        					// +usage=Name of the template to use
        					templateName: string
        				}]
        				// +usage=List of arguments to pass to the template
        				args?: [...{
        					// +usage=Name of the argument
        					name: string
        					// +usage=Value of the argument
        					value: string
        				}]
        			}
        			// +usage=The unique service name which the Rollouts controller will update to select canary pods. Label identifier "role: canary" is added to the service object ** Mandatory Parameter **
        			canaryService?: string
        			// +usage=The maximum number of new/canary replicasets pods that can be created over the desired number of pods. Absolute number or % of pods can be specified.
        			// +usage=The unique name of the service that points to the stable deployment. Label identifier "role: stable" is added to the service object ** Mandatory Parameter **
        			stableService?: string
        			// +usage=Metadata which will be attached to the Canary pods
        			canaryMetadata?: {
        				// +usage=Annotations to attach to canary pods
        				annotations?: [string]: string
        				// +usage=Labels to attach to canary pods
        				labels?: [string]: string
        			}
        			// +usage=Metadata which will be attached to the Stable pods
        			stableMetadata?: {
        				// +usage=Annotations to attach to stable pods
        				annotations?: [string]: string
        				// +usage=Labels to attach to stable pods
        				labels?: [string]: string
        			}
        			maxSurge?: *2 | int | string
        			// +usage=The maximum number of old/stable replicasets pods that can be unavailable during the update
        			maxUnavailable?: *1 | int
        			// +usage=The minimum number of pods that is requested for each ReplicaSet when using traffic routed canary (defaults to 1)
        			minPodsPerReplicaSet?: *1 | int
        			// +usage=The delay before scaling down the previous ReplicaSet when the with traffic routing (default 60 seconds)
        			scaleDownDelaySeconds?: *60 | int

        			steps?: [...{
        				// +usage=The ratio of canary ReplicaSet to 20%
        				setWeight?: int
        				// +usage=Pause the rollout for specified duration
        				pause?: {
        					duration?: string
        				}
        				// +usage=Configure how the canary is scaled during this step
        				setCanaryScale?: {
        					// +usage=Set a specific number of replicas for the canary
        					replicas?: int
        					// +usage=Set the canary scale as a percentage of the total replicas
        					weight?: int
        					// +usage=Automatically match the traffic weight with the canary scale
        					matchTrafficWeight?: bool
        				}
        				// +usage=Name of the Analysis template to use in the analysis Step
        				analysis?: {
        					// +usage=Reference to the analysis template to use
        					templates?: [...{
        						// +usage=Name of the template to use
        						templateName: string
        					}]
        					// +usage=List of arguments to pass to the template
        					args?: [...{
        						// +usage=Name of the argument
        						name: string
        						// +usage=Value of the argument
        						value: string
        					}]
        				}
        			}]
        			// +usage=To achieve traffic splitting with Nginx ingress, traffic Routing configuration is required. If omitted, traffic split is achieved via a weighted replica counts between the canary and stable ReplicaSet instead of Ingress.
        			trafficRouting?: {
        				nginx: {
        					// +usage=Name of the ingress for traffic splitting is reffered from (ingressMetaName)
        					// +usage=Additional annotations for the ingress
        					additionalIngressAnnotations?: {
        						[string]: string
        					}
        				}
        			}
        		}

        		// BlueGreen parameters
        		blueGreen?: {
        			// +usage=Name of the service that points to the active deployment
        			activeService?: string

        			// +usage=Name of the service that points to the preview deployment
        			previewService?: string

        			// +usage=Whether to automatically promote the new version once ready
        			autoPromotionEnabled?: bool

        			// +usage=Seconds to wait before auto-promoting
        			autoPromotionSeconds?: int

        			// +usage=Seconds to wait before scaling down the previous version
        			scaleDownDelaySeconds?: int

        			// +usage=Maximum number of revisions to keep before scaling down old ones
        			scaleDownDelayRevisionLimit?: int

        			// +usage=Number of replicas for the preview deployment
        			previewReplicaCount?: int

        			// +usage=Anti-affinity configuration between blue and green deployments
        			antiAffinity?: {
        				// +usage=Enforce pods to be scheduled on different nodes
        				requiredDuringSchedulingIgnoredDuringExecution?: bool

        				// +usage=Weight for pod anti-affinity
        				preferredDuringSchedulingIgnoredDuringExecution?: int
        			}

        			// +usage=Analysis to run before promoting the new version
        			prePromotionAnalysis?: {
        				// +usage=Analysis templates to run
        				templates?: [...{
        					// +usage=Name of the template to use
        					templateName: string

        					// +usage=Arguments to pass to the template
        					args?: [...{
        						// +usage=Argument name
        						name: string

        						// +usage=Argument value
        						value: string
        					}]
        				}]
        			}

        			// +usage=Analysis to run after promoting the new version
        			postPromotionAnalysis?: {
        				// +usage=Analysis templates to run
        				templates?: [...{
        					// +usage=Name of the template to use
        					templateName: string

        					// +usage=Arguments to pass to the template
        					args?: [...{
        						// +usage=Argument name
        						name: string

        						// +usage=Argument value
        						value: string
        					}]
        				}]
        			}
        		}
        	}
        	// End of Rollouts parameters

        	// *Ingress* Template parameters
        	ingress: {
        		// +usage=Specify multiple fully qualified domains or single domain for your application.
        		domains?: [...{
        			// +usage=Specify the fully qualified domain name to be exposed. The maximum length is 63 characters.
        			domain: string & =~"^.{1,64}$"
        			// +usage=Specify the mapping relationship between the http path and the workload port
        			http: [string]: int
        			pathType: *"ImplementationSpecific" | string
        		}]

        		// +usage=Specify the class of ingress to use
        		class: *"nginx" | string

        		// +usage=Specify a suffix for the ingress generated.
        		nameSuffix?: string

        		// +usage=Set ingress class in '.spec.ingressClassName' instead of 'kubernetes.io/ingress.class' annotation.
        		classInSpec: *true | bool

        		// +usage=Specify the secret name you want to quote. Not usually required. It will be self-generated based on the ingress metadata name.
        		secretName?: string

        		// +usage=Set additional annotations
        		annotations: [string]: string | null

        		// +usage= Not required for Single Domain or domains with same secret. In case you have multiple domains that doesn't share the same seceret for TLS configuration, you can configure them here.
        		tls?: [...{
        			// +usage=List of hosts that should be covered by this TLS configuration
        			hosts: [...string]
        			// +usage=Name of the secret that contains the TLS certificate and key
        			secretName: string
        		}]
        	}

        	_#healthCheck: {
        		path:             *"" | string
        		resolution:       *"Standard" | string
        		periodSeconds:    int & >=10 & <=300
        		failureThreshold: int & >=1 & <=5
        	}

        	#HealthProbe: {

        		// +usage=Instructions for assessing container health by executing a command. Either this attribute or the httpGet attribute or the tcpSocket attribute MUST be specified. This attribute is mutually exclusive with both the httpGet attribute and the tcpSocket attribute.
        		exec?: {
        			// +usage=A command to be executed inside the container to assess its health. Each space delimited token of the command is a separate array element. Commands exiting 0 are considered to be successful probes, whilst all other exit codes are considered failures.
        			command: [...string]
        		}

        		// +usage=Instructions for assessing container health by executing an HTTP GET request. Either this attribute or the exec attribute or the tcpSocket attribute MUST be specified. This attribute is mutually exclusive with both the exec attribute and the tcpSocket attribute.
        		httpGet?: {
        			// +usage=The endpoint, relative to the port, to which the HTTP GET request should be directed.
        			path: string
        			// +usage=The TCP socket within the container to which the HTTP GET request should be directed.
        			port:    int
        			host?:   string
        			scheme?: *"HTTP" | string
        			httpHeaders?: [...{
        				name:  string
        				value: string
        			}]
        		}

        		// +usage=Instructions for assessing container health by probing a TCP socket. Either this attribute or the exec attribute or the httpGet attribute MUST be specified. This attribute is mutually exclusive with both the exec attribute and the httpGet attribute.
        		tcpSocket?: {
        			// +usage=The TCP socket within the container that should be probed to assess container health.
        			port: int
        		}

        		// +usage=Number of seconds after the container is started before the first probe is initiated.
        		initialDelaySeconds: *0 | int

        		// +usage=How often, in seconds, to execute the probe.
        		periodSeconds: *10 | int

        		// +usage=Number of seconds after which the probe times out.
        		timeoutSeconds: *1 | int

        		// +usage=Minimum consecutive successes for the probe to be considered successful after having failed.
        		successThreshold: *1 | int

        		// +usage=Number of consecutive failures required to determine the container is not alive (liveness probe) or not ready (readiness probe).
        		failureThreshold: *3 | int
        	}
        }
  status:
    customStatus: |-
      ready: {
      	readyReplicas: *0 | int
      } & {
      	if context.output.status.readyReplicas != _|_ {
      		readyReplicas: context.output.status.readyReplicas
      	}
      }
      message: "Ready:\(ready.readyReplicas)/\(context.output.spec.replicas)"
    healthPolicy: |-
      ready: {
      	readyReplicas:      *0 | int
      	replicas:           *0 | int
      	phase: 							"Healthy" | string
      } & {
      	if context.output.status.readyReplicas != _|_ {
      		readyReplicas: context.output.status.readyReplicas
      	}
      	if context.output.status.replicas != _|_ {
      		replicas: context.output.status.replicas
      	}
      	if context.output.status.phase != _|_ {
      		phase: context.output.status.phase
      	}
      }
      isHealth: (context.output.spec.replicas == ready.readyReplicas) && (context.output.spec.replicas == ready.replicas) && (ready.phase == context.output.status.phase)
  workload:
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Rollout
    type: rollouts.argoproj.io
