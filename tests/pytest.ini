[pytest]
# Definition of all the custom markers used to filter out tests to be executed
markers=
    # State markers
    ready: Tests that are ready for non regression
    serial: Tests that cannot, in any way, be executed in parallel

    # Feature markers:
    # Dashboards
    traits: Admin Dashboard tests
    components: Customer dashboard tests
    e2e: End to End tests

log_cli = 1
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_format  = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_date_format = %Y-%m-%d %H:%M:%S